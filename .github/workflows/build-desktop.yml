name: Build desktop apps
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows-x64
          - os: ubuntu-24.04
            label: Linux-x64
          - os: macos-15-intel
            label: Mac-Intel
          - os: macos-15
            label: Mac-Apple-Silicon
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run regression tests
        run: python -m unittest discover -s . -v
      - name: Build and test packaged app
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: CorriLee-${{ matrix.label }}
          path: downloads/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish downloads
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - name: Collect release files
        run: |
          mkdir assets
          find release -type f \( -name '*.zip' -o -name '*.sha256' \) -exec cp {} assets/ \;
          find release -type f -name 'START-HERE.txt' -exec cp {} assets/ \; -quit
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CorriLee Grant Ranker build ${GITHUB_RUN_NUMBER}" \
            --notes "Ready-to-use Windows, Linux, and Mac downloads. Extract the ZIP for your computer, then follow START-HERE.txt. The Windows and Mac builds are unsigned, and the Mac builds are not Apple-notarised." \
            --latest
